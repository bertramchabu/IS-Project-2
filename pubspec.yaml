name: netvision_ai
description: Intelligent Network Monitoring Dashboard with BiLSTM fault anticipation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.3
  cloud_functions: ^5.1.3

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # UI
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Utilities
  get_it: ^8.0.0
  dartz: ^0.10.1
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  tflite_flutter: ^0.11.0
  permission_handler: ^11.3.1
  google_maps_flutter: 2.19.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icons/
    - model/data/network_kpi_dataset.csv