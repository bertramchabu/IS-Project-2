name: NetVision Retraining Workflow

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Queued retrainRequests document ID"
        required: true
        type: string

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r model/requirements.txt
      - name: Execute retraining runner
        working-directory: model
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.NETVISION_FIREBASE_SERVICE_ACCOUNT }}
        run: python -m src.retrain_runner --dry-run --request-id "${{ inputs.request_id }}"
