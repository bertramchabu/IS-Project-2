name: NetVision AI CI

on:
  push:
  pull_request:

jobs:
  test-and-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: set -o pipefail; flutter analyze 2>&1 | tee flutter-analyze.log

      - name: Flutter tests
        run: set -o pipefail; flutter test --reporter expanded 2>&1 | tee flutter-test.log

      - name: Python dependencies
        run: python -m pip install -r model/requirements.txt

      - name: Python tests
        working-directory: model
        run: set -o pipefail; python -m unittest discover -s tests -v 2>&1 | tee python-test.log

      - name: Model A evaluation
        working-directory: model
        run: set -o pipefail; python -m src.evaluate 2>&1 | tee model-a-evaluate.log

      - name: Model B evaluation
        working-directory: model
        run: set -o pipefail; python -m src.threat_model_evaluation 2>&1 | tee model-b-evaluate.log

      - name: Upload test and metrics artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netvision-evidence
          path: |
            flutter-analyze.log
            flutter-test.log
            model/python-test.log
            model/model-a-evaluate.log
            model/model-b-evaluate.log
            docs/evidence/METRICS_LEDGER.md
            model/results/evaluation_report.json
            model/results/comparative_evaluation.json
            model/results/threat_monitor/threat-synthetic-v1/evaluation_report.json
