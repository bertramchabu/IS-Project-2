name: NetVision Performance Evidence

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  baseline-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run baseline threshold simulator
        run: python tools/perf/baseline_threshold_sim.py --n 100
      - name: Upload performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: netvision-performance-evidence
          path: docs/evidence/BASELINE_LATENCY_RESULTS.json
